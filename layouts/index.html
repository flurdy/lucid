{{ define "main" }}
<div class="py-4 mb-3">
  <h1 class="display-5 fw-bold">{{ .Title }}</h1>
  <p class="lead text-body-secondary">{{ .Description }}</p>
  {{ with .Content }}<div class="mt-2">{{ . }}</div>{{ end }}
</div>
<hr class="my-4">
<div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
  {{ range .Site.Sections }}
  <div class="col">
    <div class="card h-100 shadow-sm">
      <div class="card-body d-flex flex-column">
        {{ with .Params.icon }}
        <img src="{{ . }}" alt="{{ $.Title }} icon" class="rounded-3 mb-3" style="width: 64px; height: 64px;">
        {{ end }}
        <h5 class="card-title">{{ .Title }}</h5>
        <p class="card-text text-body-secondary flex-grow-1">{{ .Description }}</p>
        <a href="{{ .RelPermalink }}" class="btn btn-primary btn-sm mt-2 align-self-start">View</a>
      </div>
    </div>
  </div>
  {{ end }}
</div>
{{ end }}
