{{ define "main" }}
<h1>{{ .Site.Title }}</h1>
<p>{{ .Site.Params.description }}</p>
<div class="grid">
  {{ range .Site.Sections }}
  <article>
    {{ with .Params.icon }}
    <a href="{{ $.RelPermalink }}"><img src="{{ . }}" alt="{{ $.Title }} icon" style="width: 64px; height: 64px; border-radius: 14px;"></a>
    {{ end }}
    <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    <p>{{ .Description }}</p>
  </article>
  {{ end }}
</div>
{{ end }}
