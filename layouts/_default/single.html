{{ define "main" }}
<nav aria-label="breadcrumb">
  <ul>
    <li><a href="{{ "/" | relURL }}">Home</a></li>
    {{ with .Parent }}<li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>{{ end }}
    <li>{{ .Title }}</li>
  </ul>
</nav>
<article>
  <header>
    <h1>{{ .Title }}</h1>
    {{ with .Params.lastmod }}<p><small><em>Last updated: {{ . | time.Format "2 January 2006" }}</em></small></p>{{ end }}
  </header>
  {{ .Content }}
</article>
{{ end }}
