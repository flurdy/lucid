{{ define "main" }}
<nav aria-label="breadcrumb">
  <ul>
    <li><a href="{{ "/" | relURL }}">Home</a></li>
    {{ with .Parent }}<li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>{{ end }}
    <li>{{ .Title }}</li>
  </ul>
</nav>
<article>
  <h1>{{ .Title }}</h1>
  {{ with .Params.lastmod }}<p><small>Last updated: {{ . | time.Format "2 January 2006" }}</small></p>{{ end }}
  {{ .Content }}
</article>
{{ end }}
