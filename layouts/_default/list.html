{{ define "main" }}
{{ if .Parent.IsHome }}
<nav aria-label="breadcrumb">
  <ul>
    <li><a href="{{ "/" | relURL }}">Home</a></li>
    <li>{{ .Title }}</li>
  </ul>
</nav>
{{ end }}
<h1>{{ .Title }}</h1>
{{ .Content }}
<ul>
  {{ range .Pages }}
  <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
  {{ end }}
</ul>
{{ end }}
