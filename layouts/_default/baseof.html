<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }} — {{ .Site.Title }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <link rel="icon" href="{{ "favicon.ico" | relURL }}">
  <link rel="apple-touch-icon" href="{{ "apple-touch-icon.png" | relURL }}">
  <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/flatly/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <script>var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-bs-theme',t);</script>
</head>
<body>
  <nav class="navbar navbar-expand-sm bg-body-tertiary mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{{ "/" | relURL }}">{{ .Site.Title }}</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          {{ range .Site.Sections }}
          <li class="nav-item"><a class="nav-link" href="{{ .RelPermalink }}">{{ .Title }}</a></li>
          {{ end }}
        </ul>
        <button id="theme-toggle" class="btn btn-outline-secondary btn-sm" aria-label="Toggle theme"><i class="bi bi-moon-fill"></i></button>
      </div>
    </div>
  </nav>
  <main class="container">
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="container mt-5 py-3 border-top">
    <small class="text-body-secondary">&copy; {{ now.Year }} {{ .Site.Params.author }} · <a href="https://code.flurdy.com" class="text-body-secondary">code.flurdy.com</a></small>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    (function() {
      var root = document.documentElement;
      var btn = document.getElementById('theme-toggle');
      var icon = btn.querySelector('i');
      function updateIcon(theme) {
        var isDark = theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
        icon.className = isDark ? 'bi bi-sun-fill' : 'bi bi-moon-fill';
      }
      updateIcon(root.getAttribute('data-bs-theme'));
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        var current = root.getAttribute('data-bs-theme');
        var next;
        if (current === 'dark') next = 'light';
        else if (current === 'light') next = 'dark';
        else next = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark';
        root.setAttribute('data-bs-theme', next);
        localStorage.setItem('theme', next);
        updateIcon(next);
      });
    })();
  </script>
</body>
</html>
